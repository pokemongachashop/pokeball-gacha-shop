<!DOCTYPE html>  
<html lang="ko">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">  
<title>Pokemon Gacha Shop</title>  
<style>  
:root{  
  --bg:#FFF8F0;  
  --surface:#FFFFFF;  
  --surface-2:#FFF2E4;  
  --line:#F0E1CE;  
  --text:#4A3F55;  
  --text-dim:#A597AE;  
  --pink:#FF8FA3;  
  --pink-deep:#FF6B87;  
  --sky:#6FCBEA;  
  --sky-deep:#48B4D9;  
  --yellow:#FFD75E;  
  --mint:#8FD9A8;  
  --lavender:#C9A6F2;  
  --danger:#FF8FA0;  
  --danger-deep:#FF5A78;  
  --success:#5FBE84;  
  --r-n:#B7AFC7;  
  --r-r:#8FD9A8;  
  --r-sr:#6FCBEA;  
  --r-ssr:#C9A6F2;  
  --r-ur1:#FFD98A;  
  --r-ur2:#FF9FCB;  
  --gold:#FFC93C;  
  --gold-deep:#F2A900;  
  --info-blue:#3D6BE0;  
  --urgent-red:#F0384B;  
  --radius:18px;  
  --radius-sm:12px;  
  font-size:16px;  
}  
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}  
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);  
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,Roboto,sans-serif;  
  min-height:100vh;min-height:100dvh;overscroll-behavior:none;}  
body{background:  
  radial-gradient(circle at 15% 0%, rgba(255,143,163,0.10), transparent 45%),  
  radial-gradient(circle at 90% 8%, rgba(111,203,234,0.12), transparent 42%),  
  var(--bg);}  
a{color:inherit;text-decoration:none;}  
button{font-family:inherit;cursor:pointer;}  
input,select,textarea{font-family:inherit;}  
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding-bottom:100px;}  
.admin-wrap #app{max-width:960px;padding-bottom:24px;}  
  
/* ---------- pokeball mark ---------- */  
.pball{width:26px;height:26px;border-radius:50%;position:relative;flex-shrink:0;  
  background:linear-gradient(180deg,var(--pink) 0 48%, #fff 52% 100%);border:2px solid #4A3F55;overflow:hidden;}  
.pball::before{content:'';position:absolute;left:0;right:0;top:48%;height:3px;background:#4A3F55;}  
.pball::after{content:'';position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;  
  background:#fff;border:2px solid #4A3F55;transform:translate(-50%,-50%);}  
  
/* ---------- coin dot ---------- */  
.coin-dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:4px;  
  background:radial-gradient(circle at 32% 30%, #FFF3B0, #FFC94D 60%, #E8A93A);box-shadow:inset 0 -2px 2px rgba(0,0,0,.15);}  
.coin-txt{font-weight:800;color:#B5810F;}  
  
/* ---------- header ---------- */  
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,248,240,0.94);backdrop-filter:blur(10px);  
  border-bottom:1px solid var(--line);padding:10px 14px;}  
.topbar-row{display:flex;align-items:center;gap:10px;}  
.logo{font-weight:800;font-size:16px;letter-spacing:-0.02em;display:flex;align-items:center;gap:7px;}  
.coin-pill{display:flex;align-items:center;gap:2px;background:var(--gold);border:1px solid var(--gold-deep);  
  padding:7px 14px;border-radius:999px;font-size:13px;font-weight:800;color:#4A3300;}  
.spacer{flex:1;}  
.name-chip{font-size:12px;color:var(--text-dim);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}  
.navpills{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:1px;}  
.navpills::-webkit-scrollbar{display:none;}  
.navpill{flex-shrink:0;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--surface);  
  color:var(--text-dim);border:1px solid var(--line);}  
.navpill.on{background:var(--gold);color:#4A3300;border-color:var(--gold-deep);}  
  
/* ---------- bottom nav ---------- */  
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:var(--surface);  
  border-top:1px solid var(--line);padding:8px 4px calc(6px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;}  
.admin-wrap .bottom-nav{display:none;}  
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-dim);padding:4px 2px;}  
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;}  
.bn-item span{font-size:10.5px;font-weight:700;}  
.bn-item.on{color:var(--info-blue);}  
.bn-item.on svg{stroke:var(--info-blue);}  
  
/* ---------- generic ---------- */  
.section{padding:16px 14px 4px;}  
.h1{font-size:20px;font-weight:800;margin:0 0 4px;letter-spacing:-0.02em;}  
.h2{font-size:15px;font-weight:800;margin:18px 0 10px;color:var(--text);}  
.muted{color:var(--text-dim);font-size:13px;}  
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:0 2px 10px rgba(200,150,120,0.06);}  
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1px solid var(--line);  
  background:var(--surface);color:var(--text);padding:10px 16px;font-weight:800;font-size:13px;}  
.btn.primary{background:var(--gold);border:none;color:#4A3300;}  
.btn.gold{background:linear-gradient(135deg,#FFE9A8,var(--yellow));border:none;color:#6B4E00;}  
.btn.mint{background:var(--mint);border:none;color:#1E4A2E;}  
.btn.block{width:100%;}  
.btn.sm{padding:6px 13px;font-size:12px;border-radius:999px;}  
.btn.outline-info{background:#fff;border:1.5px solid var(--info-blue);color:var(--info-blue);}  
.btn.danger{background:#FFEAEF;border-color:#FFC9D4;color:var(--danger-deep);}  
.btn:disabled{opacity:.4;cursor:not-allowed;}  
.field{margin-bottom:12px;}  
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:700;}  
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);  
  color:var(--text);border-radius:16px;padding:13px 16px;font-size:14px;}  
.field textarea{resize:vertical;min-height:64px;border-radius:16px;}  
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}  
.row{display:flex;gap:8px;}  
.row>*{flex:1;}  
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;letter-spacing:.02em;}  
.badge.N{background:rgba(183,175,199,.22);color:#7A7089;}  
.badge.R{background:rgba(143,217,168,.28);color:#2E7A48;}  
.badge.SR{background:rgba(111,203,234,.28);color:#1D7EA0;}  
.badge.SSR{background:rgba(201,166,242,.28);color:#7B3FC4;}  
.badge.UR{background:linear-gradient(90deg,#FFE1A0,#FFC1DC);color:#8A4A00;}  
.toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:calc(100% - 28px);max-width:480px;}  
.toast{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13px;  
  font-weight:700;box-shadow:0 8px 24px rgba(180,140,110,0.18);animation:toastin .18s ease;}  
.toast.err{border-color:#FFC9D4;color:var(--danger-deep);background:#FFF3F5;}  
.toast.ok{border-color:#BFE9CC;color:var(--success);background:#F2FBF5;}  
@keyframes toastin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}  
.empty{text-align:center;padding:44px 20px;color:var(--text-dim);}  
.setup-screen{max-width:640px;margin:40px auto;padding:0 20px;line-height:1.7;}  
.setup-screen pre{background:#2c2438;color:#f4e9ff;padding:14px;border-radius:12px;overflow-x:auto;font-size:12px;}  
  
/* ---------- hero banner ---------- */  
.hero-card{margin:14px 14px 0;background:linear-gradient(160deg,#FFF6DE,#FFFDF6);  
  border:1px solid var(--line);border-radius:22px;padding:22px 20px;}  
.hero-tag{color:var(--info-blue);font-weight:800;font-size:13px;margin-bottom:8px;}  
.hero-title{font-size:23px;font-weight:800;line-height:1.28;letter-spacing:-0.02em;margin-bottom:12px;}  
.hero-desc{color:var(--text-dim);font-size:13px;line-height:1.6;margin-bottom:16px;}  
.hero-actions{display:flex;gap:8px;}  
.hero-actions .btn{flex:1;padding:13px 10px;font-size:13.5px;}  
  
/* ---------- charge (top-up) ---------- */  
.charge-info-card{border:1.5px solid var(--info-blue);background:linear-gradient(160deg,#F3F6FF,#FFFFFF);}  
.charge-steps{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--text);}  
.charge-steps li{margin-bottom:4px;}  
  
/* ---------- urgent notice bar ---------- */  
.urgent-strip{margin:14px 14px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;  
  padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;}  
.urgent-tag{flex-shrink:0;background:var(--urgent-red);color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;}  
.urgent-strip .spacer{flex:1;}  
.urgent-strip .chev{color:var(--text-dim);font-size:16px;}  
  
/* ---------- pack list (vertical cards) ---------- */  
.pack-list{padding:4px 14px 6px;display:flex;flex-direction:column;gap:12px;}  
.pack-list-card{border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);cursor:pointer;}  
.pack-list-card.active{border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(242,169,0,.18);}  
.pack-list-card .pc-img{width:100%;max-height:220px;object-fit:cover;display:block;background:var(--surface-2);}  
.pack-list-card .pc-noimg{width:100%;height:140px;background:linear-gradient(135deg,var(--surface-2),var(--line));  
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:11px;}  
.pack-list-card .pc-body{padding:14px 16px 16px;}  
.pack-list-card .pc-name{font-size:16px;font-weight:800;margin-bottom:4px;}  
.pack-list-card .pc-desc{font-size:12.5px;color:var(--text-dim);margin-bottom:10px;line-height:1.5;}  
.pack-list-card .pc-price-pill{display:inline-block;background:var(--gold);color:#4A3300;font-weight:800;  
  font-size:13px;padding:6px 14px;border-radius:999px;}  
.pack-scroll{display:flex;gap:12px;overflow-x:auto;padding:14px 14px 6px;scroll-snap-type:x mandatory;}  
.pack-scroll::-webkit-scrollbar{display:none;}  
.pack-card{flex:0 0 168px;scroll-snap-align:start;border-radius:18px;overflow:hidden;border:2px solid var(--line);  
  background:var(--surface);position:relative;}  
.pack-card.active{border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(242,169,0,.20);}  
.pack-card .pc-img{width:100%;height:112px;object-fit:cover;display:block;background:var(--surface-2);}  
.pack-card .pc-noimg{width:100%;height:112px;background:linear-gradient(135deg,var(--surface-2),var(--line));  
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:11px;}  
.pack-card .pc-body{padding:9px 10px 11px;}  
.pack-card .pc-name{font-size:13px;font-weight:800;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}  
.pack-card .pc-price{font-size:11.5px;font-weight:700;}  
.rec-tag{position:absolute;top:6px;left:6px;background:var(--yellow);color:#6B4E00;font-size:10px;font-weight:800;  
  padding:2px 8px;border-radius:999px;}  
  
/* ---------- product grid ---------- */  
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 14px 8px;}  
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;}  
.pcard .pc-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--surface-2);}  
.pcard .pc-noimg{width:100%;aspect-ratio:3/4;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:10px;}  
.pcard .pc-info{padding:7px 7px 9px;}  
.pcard .pc-name{font-size:11.5px;font-weight:700;line-height:1.25;margin-bottom:4px;height:28px;overflow:hidden;}  
.soldout-ov{position:absolute;inset:0;background:rgba(74,63,85,.62);display:flex;align-items:center;justify-content:center;  
  font-size:12px;font-weight:800;color:#fff;}  
.pct{font-size:10px;color:var(--text-dim);}  
  
/* ---------- draw bar ---------- */  
.drawbar{position:fixed;bottom:58px;left:0;right:0;z-index:50;background:rgba(255,248,240,.97);backdrop-filter:blur(12px);  
  border-top:1px solid var(--line);padding:10px 14px;}  
.drawbar-inner{max-width:520px;margin:0 auto;display:flex;gap:8px;}  
.draw-btn{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;  
  text-align:center;color:var(--text);}  
.draw-btn .dn{font-size:12.5px;font-weight:800;}  
.draw-btn .dp{font-size:11px;margin-top:2px;font-weight:700;color:#B5810F;}  
.draw-btn.hot{background:var(--gold);border:none;color:#4A3300;}  
.draw-btn.hot .dp{color:#4A3300;opacity:.75;}  
  
/* ---------- modal ---------- */  
.modal-bg{position:fixed;inset:0;background:rgba(74,63,85,.42);z-index:150;display:flex;align-items:flex-end;justify-content:center;}  
@media(min-width:560px){.modal-bg{align-items:center;}}  
.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:520px;  
  max-height:88vh;overflow-y:auto;padding:18px;animation:modalin .2s ease;}  
@media(min-width:560px){.modal{border-radius:20px;}}  
@keyframes modalin{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}  
.modal.wide{max-width:640px;}  
.modal-head{display:flex;align-items:center;margin-bottom:14px;}  
.modal-head .mt{font-size:16px;font-weight:800;flex:1;}  
  
/* ---------- draw reveal ---------- */  
.reveal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0;}  
.reveal-cell{position:relative;z-index:0;overflow:visible;}  
.reveal-cell-clip{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--surface-2);}  
.rc-face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface-2);}  
.rc-face-noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:10px;background:var(--surface-2);}  
.rc-mask{position:absolute;inset:0;z-index:5;background:linear-gradient(135deg,#FF8FA3,#6FCBEA);  
  background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;  
  cursor:grab;touch-action:none;will-change:transform;}  
.rc-mask img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}  
.rc-mask-hint{position:relative;z-index:1;color:#fff;font-size:10.5px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.35);  
  background:rgba(74,63,85,.28);padding:4px 8px;border-radius:999px;}  
.rc-mask.dragging{cursor:grabbing;transition:none;}  
.rc-mask.settling{transition:transform .28s cubic-bezier(.2,.8,.3,1);}  
.rc-mask.gone{display:none;}  
.reveal-cell.aurora-SSR .reveal-cell-clip{border-color:transparent;}  
.reveal-cell.aurora-SSR::before{content:'';position:absolute;inset:-16%;z-index:-1;border-radius:22px;  
  background:radial-gradient(ellipse at center, var(--r-ssr) 0%, rgba(201,166,242,.45) 50%, transparent 74%);  
  filter:blur(13px);animation:aurora-glow 2s ease-in-out infinite alternate;}  
.reveal-cell.aurora-UR .reveal-cell-clip{border-color:transparent;}  
.reveal-cell.aurora-UR::before{content:'';position:absolute;inset:-18%;z-index:-1;border-radius:24px;  
  background:radial-gradient(ellipse at center, var(--r-ur2) 0%, var(--r-ur1) 45%, transparent 76%);  
  filter:blur(15px);animation:aurora-glow 1.5s ease-in-out infinite alternate;}  
@keyframes aurora-glow{  
  0%{opacity:.55;transform:scale(.9);}  
  100%{opacity:1;transform:scale(1.08);}  
}  
.reveal-cell.revealed::before{display:none;}  
.rc-name{font-size:10.5px;padding:5px 6px;font-weight:700;text-align:center;}  
.reveal-actions{display:flex;gap:8px;margin-top:6px;}  
@media(max-width:480px){  
  .reveal-grid{grid-template-columns:repeat(4,1fr);gap:7px;}  
  .rc-name{font-size:8.5px;padding:3px 3px;}  
  .rc-mask-hint{font-size:8px;padding:3px 6px;}  
}  
  
/* ---------- inventory ---------- */  
.inv-toolbar{display:flex;gap:8px;padding:12px 14px 0;flex-wrap:wrap;}  
.chip{background:var(--surface);border:1px solid var(--line);color:var(--text-dim);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;}  
.chip.on{background:var(--gold);color:#4A3300;border-color:var(--gold-deep);}  
.inv-item{display:flex;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:8px 14px;}  
.inv-item img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--surface-2);flex-shrink:0;}  
.inv-item .ii-noimg{width:64px;height:64px;border-radius:12px;background:var(--surface-2);flex-shrink:0;}  
.inv-item .ii-body{flex:1;min-width:0;}  
.inv-item .ii-name{font-weight:800;font-size:13.5px;margin-bottom:3px;}  
.inv-item .ii-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}  
  
/* ---------- notice / draw history rows ---------- */  
.list-row{padding:14px;border-bottom:1px solid var(--line);cursor:pointer;}  
.list-row .lr-title{font-weight:800;font-size:14px;margin-bottom:3px;}  
.list-row .lr-meta{font-size:11.5px;color:var(--text-dim);}  
  
/* ---------- auth ---------- */  
.auth-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-start;padding:32px 24px;padding-top:14vh;}  
.auth-logo{text-align:center;margin-bottom:28px;}  
.auth-logo .al-mark{width:56px;height:56px;margin:0 auto 12px;transform:scale(2);}  
.auth-logo .al-title{font-size:19px;font-weight:800;}  
.auth-logo .al-sub{font-size:12.5px;color:var(--text-dim);margin-top:4px;}  
.switch-line{text-align:center;margin-top:16px;font-size:13px;color:var(--text-dim);}  
.switch-line b{color:var(--sky-deep);font-weight:800;}  
  
/* ---------- upload field ---------- */  
.upload-field{display:flex;gap:10px;align-items:center;}  
.upload-preview{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);flex-shrink:0;}  
.upload-preview-empty{width:64px;height:64px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);flex-shrink:0;  
  display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--text-dim);text-align:center;}  
.upload-btn-wrap{position:relative;flex:1;}  
.upload-btn-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}  
  
/* ---------- admin ---------- */  
.admin-shell{display:flex;min-height:100vh;}  
.admin-side{width:190px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;}  
.admin-side .as-title{font-size:13px;font-weight:800;padding:6px 10px 14px;color:var(--text-dim);display:flex;align-items:center;gap:8px;}  
.admin-link{display:block;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;color:var(--text-dim);margin-bottom:2px;}  
.admin-link.on{background:var(--surface-2);color:var(--text);}  
.admin-main{flex:1;padding:18px 20px;min-width:0;}  
.admin-topbar-btn{display:flex;justify-content:flex-end;margin-bottom:10px;}  
.admin-topbar{display:flex;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}  
.admin-topbar h1{font-size:18px;margin:0;flex:1;}  
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}  
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}  
.stat-box .sv{font-size:20px;font-weight:800;}  
.stat-box .sl{font-size:11.5px;color:var(--text-dim);margin-top:2px;}  
table{width:100%;border-collapse:collapse;font-size:12.5px;}  
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);}  
th{color:var(--text-dim);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}  
tr:hover td{background:rgba(242,169,0,.05);}  
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;}  
.mobile-admin-nav{display:none;}  
@media(max-width:680px){  
  .admin-shell{flex-direction:column;}  
  .admin-side{display:none;}

/* ---------------- Cloudinary 설정 (이미지 업로드용) ----------------

const CLOUDINARY_CLOUD_NAME = "YOUR_CLOUD_NAME";

/* ---------------- utils ---------------- */  
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  try{  
    if(!ts) return '방금 전';

  }catch(e){ return '-'; }

/* ---------------- image upload (gallery/camera -> Cloudinary) ----------------  
   이미지를 Firestore에 base64로 저장하지 않는다. 대신 캔버스에서 적당한  
   해상도로 리사이즈한 뒤 Blob으로 변환해 Cloudinary에 업로드하고,  
   Cloudinary가 반환하는 URL 문자열만 Firestore 필드에 저장한다.  
   이렇게 하면 Firestore 문서는 작은 텍스트만 갖게 되어 저장 용량/  
   읽기 전송량 문제가 해결되고, 이미지는 브라우저가 URL 기준으로  
   캐싱하므로 같은 이미지를 반복해서 다시 받지 않는다. */  
function loadImageEl(file){  
  return new Promise((resolve,reject)=>{  
    const img = new Image();  
    const url = URL.createObjectURL(file);  
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };  
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('이미지를 읽을 수 없습니다.')); };  
    img.src = url;  
  });  
}  
async function resizeImageToBlob(file, opts){  
  const maxDim = (opts && opts.maxDim) || 1280;  
  const quality = (opts && opts.quality) || 0.85;  
  const img = await loadImageEl(file);  
  let {width,height} = img;  
  if(width>maxDim || height>maxDim){  
    if(width>height){ height = Math.round(height*maxDim/width); width = maxDim; }  
    else{ width = Math.round(width*maxDim/height); height = maxDim; }  
  }  
  const canvas = document.createElement('canvas');  
  canvas.width = width; canvas.height = height;  
  canvas.getContext('2d').drawImage(img,0,0,width,height);  
  return await new Promise((resolve,reject)=>{  
    canvas.toBlob(blob=>{ blob ? resolve(blob) : reject(new Error('이미지 변환에 실패했습니다.')); }, 'image/jpeg', quality);  
  });  
}  
async function uploadToCloudinary(blob, folder){  
  const form = new FormData();  
  form.append('file', blob);  
  form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);  
  if(folder) form.append('folder', folder);  
  let res;  
  try{  
    res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {method:'POST', body:form});  
  }catch(e){  
    throw new Error('Cloudinary 서버에 연결하지 못했습니다. 네트워크 상태를 확인해주세요.');  
  }  
  if(!res.ok){  
    let msg = '';  
    try{ const err = await res.json(); msg = err && err.error && err.error.message; }catch(e){}  
    throw new Error('Cloudinary 업로드 실패'+(msg?': '+msg:'')+' (upload_preset이 Unsigned로 설정되어 있는지 확인해주세요.)');  
  }  
  const data = await res.json();  
  return data.secure_url;  
}  
async function uploadImage(file, folder){  
  if(!CLOUDINARY_READY){  
    throw new Error('Cloudinary 설정이 필요합니다. 코드 상단의 CLOUDINARY_CLOUD_NAME / CLOUDINARY_UPLOAD_PRESET 값을 채워주세요.');  
  }  
  const blob = await resizeImageToBlob(file, {maxDim:1280, quality:0.85});  
  return await uploadToCloudinary(blob, folder);  
}  
/* renders an upload field; draft[key] holds current url, updated on upload */  
function uploadFieldHtml(fieldId, label, draft, key, folder){  
  const url = draft[key] || '';  
  return `  
  <div class="field">  
    <label>${esc(label)}</label>  
    <div class="upload-field">  
      <div id="${fieldId}_preview">${url ? `<img class="upload-preview" src="${esc(url)}">` : `<div class="upload-preview-empty">이미지 없음</div>`}</div>  
      <div class="upload-btn-wrap">  
        <button type="button" class="btn sm block" id="${fieldId}_btn">사진첩에서 선택</button>  
        <input type="file" accept="image/*" id="${fieldId}_input">  
      </div>  
    </div>  
  </div>`;  
}  
function wireUploadField(fieldId, draft, key, folder){  
  const input = document.getElementById(fieldId+'_input');  
  if(!input) return;  
  input.onchange = async (e)=>{  
    const file = e.target.files[0];  
    if(!file) return;  
    document.getElementById(fieldId+'_preview').innerHTML = `<div class="upload-preview-empty">업로드중</div>`;  
    try{  
      const url = await uploadImage(file, folder);  
      draft[key] = url;  
      document.getElementById(fieldId+'_preview').innerHTML = `<img class="upload-preview" src="${esc(url)}">`;  
    }catch(err){  
      toast('이미지 업로드 실패: '+err.message,'err');  
      document.getElementById(fieldId+'_preview').innerHTML = draft[key] ? `<img class="upload-preview" src="${esc(draft[key])}">` : `<div class="upload-preview-empty">이미지 없음</div>`;  
    }  
  };  
}  
  
/* ---------------- state ---------------- */

/* ---------------- auth ---------------- */  
async function checkUsersEmpty(){  
  const snap = await getDocs(query(collection(db,'users'), limit(1)));

}  
async function reserveNickname(key, uidVal){  
  const nameRef = doc(db,'usernames',key);  
  await runTransaction(db, async(tx)=>{  
    const snap = await tx.get(nameRef);  
    if(snap.exists()) throw new Error('DUP_NAME');  
    tx.set(nameRef, {uid:uidVal||null, reservedAt: serverTimestamp()});  
  });  
}  
async function doRegister(loginId, password, displayName){  
  loginId = (loginId||'').trim();  
  displayName = (displayName||'').trim();  
  if(loginId.length<3) throw new Error('아이디는 3자 이상이어야 합니다.');

  if(!displayName) throw new Error('닉네임을 입력해주세요.');

  let cred;  
  try{

    throw new Error('가입 중 오류가 발생했습니다: '+err.message);  
  }  
  try{  
    await reserveNickname(key, cred.user.uid);  
  }catch(e){

    if(e.message==='DUP_NAME') throw new Error('이미 사용 중인 닉네임입니다.');

  };

}

/* ---------------- 자동 로그아웃 (5분 미접속 시) ---------------- */  
const INACTIVITY_LIMIT_MS = 5 * 60 * 1000; // 5분  
let lastActivityAt = Date.now();  
let inactivityTimerId = null;  
function markActivity(){ lastActivityAt = Date.now(); }  
['click','keydown','mousemove','touchstart','pointerdown','scroll','visibilitychange'].forEach(evt=>{  
  window.addEventListener(evt, markActivity, {passive:true});  
});  
function startInactivityWatcher(){  
  stopInactivityWatcher();  
  lastActivityAt = Date.now();  
  inactivityTimerId = setInterval(()=>{  
    if(document.visibilityState==='visible') { /* 활성 탭에서만 체크해도 되지만 백그라운드도 동일하게 처리 */ }  
    if(state.authUid && (Date.now() - lastActivityAt) > INACTIVITY_LIMIT_MS){  
      stopInactivityWatcher();  
      signOut(auth).then(()=>{ toast('5분간 활동이 없어 자동 로그아웃되었습니다.','err'); }).catch(()=>{});  
    }  
  }, 15000);  
}  
function stopInactivityWatcher(){  
  if(inactivityTimerId){ clearInterval(inactivityTimerId); inactivityTimerId = null; }  
}  
  
/* ---------------- data loading (공개 데이터: 실시간 구독 대신 1회 조회 + 캐시) ----------------  
   cardPacks / products / notices / siteSettings 는 모든 접속자에게 실시간으로  
   push될 필요가 없는 데이터이므로, 로그인/로그아웃(auth 상태 변경) 시점에  
   딱 1번만 getDocs/getDoc으로 불러와 state에 캐싱한다. 이후 화면 이동에서는  
   재조회하지 않고 캐시된 state를 그대로 사용하며, 관리자가 데이터를 수정한  
   경우에만 해당 컬렉션을 다시 불러온다(reloadCardPacks/reloadProducts/  
   reloadNotices/reloadSettings). 뽑기 시 재고 정확성은 이 캐시와 무관하게  
   runTransaction()이 Firestore 최신 문서를 직접 읽어 보장한다. */  
async function loadPublicData(){  
  try{  
    const [packSnap, prodSnap, noticeSnap, settingsSnap] = await Promise.all([  
      getDocs(query(collection(db,'cardPacks'), orderBy('sortOrder','asc'))),  
      getDocs(collection(db,'products')),  
      getDocs(collection(db,'notices')),  
      getDoc(doc(db,'siteSettings','config'))

  /* 본인 users/{uid} 문서는 단일 문서 리스너라 비용이 낮고, 관리자가 코인을  
     충전/차감했을 때 사용자 화면에 즉시 반영되는 가치가 커서 그대로 유지한다.  
     (요청하신 최적화 최우선순위 목록에도 이 항목은 포함되어 있지 않음) */  
  state.unsub.push(onSnapshot(doc(db,'users',uidVal), snap=>{

    scheduleRender();

}

function onAuthStateChangedSafe(){  
  if(!CONFIG_READY){ render(); return; }  
  onAuthStateChanged(auth, (u)=>{  
    clearSubs();  
    state.user=null; state.users={}; state.inventory=[]; state.drawLogs=[]; state.auditLogs=[]; state.admins=[]; state.claims=[]; state.chargeRequests=[];  
    state._drawLogsLoaded=false; state._usersLoaded=false; state._claimsLoaded=false; state._chargeRequestsLoaded=false;  
    state._coinLedgersLoaded=false; state._auditLogsLoaded=false; state._adminSubscribed=false;  
    state.authUid = u ? u.uid : null;  
    loadPublicData();  
    if(u){  
      subscribeUserData(u.uid);  
      startInactivityWatcher();  
    } else {  
      stopInactivityWatcher();  
    }  
    render();  
  });  
}  
  
function currentRoute(){ return (location.hash || '#/home').replace('#',''); }  
  
/* 여러 onSnapshot이 거의 동시에 발생할 때(특히 최초 로딩 시) 매번 전체 DOM을 다시 그리지 않고  
   한 프레임에 한 번만 render()가 실행되도록 묶어서 로딩 체감 속도를 개선한다. */  
let _renderScheduled = false;  
function scheduleRender(){  
  if(_renderScheduled) return;  
  _renderScheduled = true;  
  Promise.resolve().then(()=>{ _renderScheduled = false; render(); });  
}  
  
function render(){  
  if(!CONFIG_READY){ renderSetupScreen(); return; }  
  const route = currentRoute();  
  const u = state.user;  
  document.body.classList.toggle('admin-wrap', route.startsWith('/admin'));  
  
  if(u && u.role==='ADMIN' && route.startsWith('/admin') && !state._adminSubscribed){  
    enterAdminSection();  
  }  
  if(!route.startsWith('/admin') && state._adminSubscribed){  
    // 관리자 화면을 벗어나면 온디맨드로 불러온 무거운 목록들의 로딩 플래그를 초기화해  
    // 다음 진입 시 최신 데이터를 다시 가져오도록 한다  
    leaveAdminSection();  
  }  
  
  if(state.settings.maintenanceMode && !(u && u.role==='ADMIN') && route!=='/login' && route!=='/register'){  
    state._authRoute = null;  
    renderMaintenance(); return;  
  }  
  if(route==='/login'){  
    if(state._authRoute!=='/login'){ state._authRoute='/login'; renderLogin(); }  
    return;  
  }  
  if(route==='/register'){  
    if(state._authRoute!=='/register'){ state._authRoute='/register'; renderRegister(); }  
    return;  
  }  
  state._authRoute = null;  
  if(!state.authUid){ if(route!=='/login') go('#/login'); return; }  
  if(!u){ document.getElementById('app').innerHTML = '<div class="empty">불러오는 중...</div>'; return; }  
  
  if(route.startsWith('/admin')){  
    if(u.role!=='ADMIN'){ toast('관리자 권한이 없습니다.','err'); go('#/home'); return; }  
    return renderAdmin(route);  
  }  
  if(route==='/inventory') return renderInventory();  
  if(route==='/notice') return renderNoticeList();  
  if(route.startsWith('/notice/')) return renderNoticeDetail(route.split('/')[2]);  
  if(route==='/draw-history') return renderDrawHistory();  
  if(route.startsWith('/draw-history/')) return renderDrawHistoryDetail(route.split('/')[2]);  
  if(route==='/profile') return renderProfile();  
  if(route==='/charge') return renderCharge();  
  return renderHome();  
}  
window.render = render;

/* ---------------- Draw (Firestore transaction) ---------------- */  
window.doDraw = async function(count){  
  const u = state.user;  
  const packId = state.currentPackId;  
  const pack = state.cardPacks.find(p=>p.id===packId);  
  if(!pack) return toast('카드팩을 찾을 수 없습니다.','err');  
  const priceMap = {1:pack.drawPrice1, 5:pack.drawPrice5, 10:pack.drawPrice10};  
  const price = priceMap[count];  
  if(u.coin < price) return toast('코인이 부족합니다.','err');  
  const candidateProducts = state.products.filter(p=>p.cardPackId===packId && p.status==='ACTIVE' && !p.forceSoldOut && p.currentStock>0);  
  if(candidateProducts.length===0) return toast('뽑을 수 있는 상품이 없습니다.','err');  
  
  const maxAttempts = 4;  
  let lastErr = null;  
  for(let attempt=0; attempt<maxAttempts; attempt++){  
    try{  
      const drawn = await runTransaction(db, async (tx)=>{  
        const userRef = doc(db,'users',u.uid);  
        const userSnap = await tx.get(userRef);  
        const userData = userSnap.data();  
        if(!userData || userData.coin < price) throw new Error('INSUFFICIENT_COIN');  
        // 화면에 캐시된 재고/확률 정보로 먼저 확률 추첨을 진행하고, 트랜잭션 안에서는  
        // 실제로 뽑힌 상품 문서만 읽고 검증한다. (모든 활성 상품을 매번 읽고 쓰면  
        // 동시에 뽑기를 하는 다른 유저들과 문서가 겹쳐 트랜잭션 충돌이 잦아지는 원인이 된다)  
        let pool = candidateProducts.map(p=>({...p}));  
        const picks = [];  
        for(let i=0;i<count;i++){  
          if(pool.length===0) break;  
          const totalWeight = pool.reduce((s,p)=>s+Number(p.probability),0) || 1;  
          let r = Math.random()*totalWeight;  
          let picked = pool[pool.length-1];  
          for(const p of pool){ if(r < p.probability){ picked=p; break; } r -= p.probability; }  
          picks.push(picked.id);  
          picked.currentStock -= 1;  
          if(picked.currentStock<=0) pool = pool.filter(p=>p.id!==picked.id);  
        }  
        if(picks.length===0) throw new Error('NO_STOCK');  
  
        const uniqueIds = [...new Set(picks)];  
        const productSnaps = {};  
        for(const pid of uniqueIds){  
          productSnaps[pid] = await tx.get(doc(db,'products',pid));  
        }  
  
        const results = [];  
        const stockDelta = {};  
        for(const pid of picks){  
          const snap = productSnaps[pid];  
          const data = snap.exists() ? snap.data() : null;  
          const already = stockDelta[pid] || 0;  
          if(!data || data.status!=='ACTIVE' || data.forceSoldOut || (data.currentStock - already) <= 0) continue;  
          stockDelta[pid] = already + 1;  
          results.push({id:pid, ...data});  
        }  
        if(results.length===0) throw new Error('NO_STOCK');  
        Object.keys(stockDelta).forEach(pid=>{  
          const before = productSnaps[pid].data().currentStock;  
          tx.update(doc(db,'products',pid), {currentStock: before - stockDelta[pid], updatedAt: serverTimestamp()});  
        });  
        const newCoin = userData.coin - price;  
        tx.update(userRef, {coin:newCoin, updatedAt:serverTimestamp()});  
        const ledgerRef = doc(collection(db,'coinLedgers'));  
        tx.set(ledgerRef, {uid:u.uid, type:'DRAW', beforeCoin:userData.coin, changeCoin:-price, afterCoin:newCoin,  
          memo:`${pack.name} ${count}회 뽑기`, createdAt:serverTimestamp(), createdAtKST:kstNow()});  
        results.forEach(rItem=>{  
          const itemRef = doc(collection(db,'inventories',u.uid,'items'));  
          tx.set(itemRef, {productId:rItem.id, cardPackId:packId, name:rItem.name, imageUrl:rItem.imageUrl||'', rarity:rItem.rarity,  
            sellCoin:rItem.sellCoin, isFavorite:false, isLocked:false, isNew:true, status:'ACTIVE',  
            obtainedAt: serverTimestamp(), obtainedAtKST: kstNow()});  
        });  
        const logRef = doc(collection(db,'drawLogs'));  
        const logData = {uid:u.uid, displayName:userData.displayName, cardPackId:packId, cardPackName:pack.name,  
          drawType:`${count}연속`, results:results.map(rr=>({productId:rr.id,name:rr.name,rarity:rr.rarity,imageUrl:rr.imageUrl||''})),  
          usedCoin:price, createdAt:serverTimestamp(), createdAtKST:kstNow()};  
        tx.set(logRef, logData);  
        return {results, logId:logRef.id, logData, stockDelta};  
      });  
      // Firestore를 다시 읽지 않고, 방금 뽑기 결과로 로컬 state만 낙관적으로 갱신한다.  
      // (화면에 보이는 재고는 약간의 지연이 있을 수 있으나, 실제 뽑기 검증은 항상  
      //  위 runTransaction()이 최신 Firestore 문서를 기준으로 처리하므로 정확성에는 영향 없음)  
      Object.keys(drawn.stockDelta).forEach(pid=>{  
        const prod = state.products.find(pp=>pp.id===pid);  
        if(prod) prod.currentStock = Math.max(0, (prod.currentStock||0) - drawn.stockDelta[pid]);  
      });  
      if(state._drawLogsLoaded){  
        state.drawLogs.unshift({id:drawn.logId, ...drawn.logData, createdAt:new Date()});  
      }  
      showDrawReveal(drawn.results, pack);  
      return;  
    }catch(e){  
      lastErr = e;  
      if(e.message==='INSUFFICIENT_COIN' || e.message==='NO_STOCK') break;  
      await new Promise(res=>setTimeout(res, 250 + attempt*250));  
    }  
  }  
  console.error(lastErr);  
  if(lastErr && lastErr.message==='INSUFFICIENT_COIN') toast('코인이 부족합니다.','err');  
  else if(lastErr && lastErr.message==='NO_STOCK') toast('재고가 부족합니다.','err');  
  else if(lastErr && lastErr.code==='resource-exhausted') toast('Firebase 사용량 한도를 초과했습니다. 잠시 후 다시 시도해주세요.','err');  
  else toast('다른 유저와 요청이 겹쳐 처리가 지연되었습니다. 다시 시도해주세요.','err');  
};  
  
/* ---------------- Draw reveal (drag-to-uncover mask) ---------------- */  
function showDrawReveal(results, pack){  
  const maskUrl = pack.maskImageUrl || '';  
  const cellsHtml = results.map((p,i)=>{  
    const aurora = (p.rarity==='SSR' || p.rarity==='UR') ? ('aurora-'+p.rarity) : '';  
    return `  
    <div class="reveal-cell ${aurora}" data-idx="${i}" data-rarity="${p.rarity}">  
      <div class="reveal-cell-clip">  
        ${p.imageUrl ? `<img class="rc-face" src="${esc(p.imageUrl)}">` : `<div class="rc-face-noimg">이미지 없음</div>`}  
        <div class="rc-mask" id="mask_${i}" style="${maskUrl?`background-image:url('${esc(maskUrl)}')`:''}">  
          ${maskUrl?'':''}  
          <span class="rc-mask-hint">밀어서 확인</span>  
        </div>  
      </div>  
      <div class="rc-name" id="name_${i}" style="visibility:hidden;">${esc(p.name)}<br><span class="badge ${p.rarity}">${rarityLabel(p.rarity)}</span></div>  
    </div>`;  
  }).join('');  
  openModal(`  
    <div class="modal-head"><div class="mt">뽑기 결과</div><button class="btn sm" onclick="closeModal(); render();">닫기</button></div>  
    <div class="reveal-grid">${cellsHtml}</div>  
    <div class="reveal-actions">  
      <button class="btn primary block" id="revealAllBtn">전체 개봉</button>  
    </div>  
  `, results.length>3);  
  results.forEach((p,i)=>{  
    const mask = document.getElementById('mask_'+i);  
    attachDragReveal(mask, ()=>onCardRevealed(i));  
  });  
  document.getElementById('revealAllBtn').onclick = ()=>{  
    results.forEach((p,i)=>{  
      setTimeout(()=>{ autoRevealCard(i); }, i*140);  
    });  
  };  
}  
function onCardRevealed(i){  
  const nameEl = document.getElementById('name_'+i);  
  if(nameEl) nameEl.style.visibility='visible';  
  const cell = document.querySelector(`.reveal-cell[data-idx="${i}"]`);  
  if(cell) cell.classList.add('revealed');  
}  
function autoRevealCard(i){  
  const mask = document.getElementById('mask_'+i);  
  if(!mask || mask.classList.contains('gone')) return;  
  mask.classList.add('settling');  
  mask.style.transform = 'translateX(160%) rotate(18deg)';  
  setTimeout(()=>{ mask.classList.add('gone'); onCardRevealed(i); }, 280);  
}  
function attachDragReveal(mask, onRevealed){  
  if(!mask) return;  
  let startX=0, startY=0, dx=0, dragging=false, done=false;  
  const cell = mask.closest('.reveal-cell-clip');  
  const width = ()=> cell ? cell.offsetWidth : 100;  
  function onDown(e){  
    if(done) return;  
    dragging = true; done=false;  
    mask.classList.remove('settling'); mask.classList.add('dragging');  
    const pt = e.touches ? e.touches[0] : e;  
    startX = pt.clientX; startY = pt.clientY; dx=0;  
    mask.setPointerCapture && e.pointerId!=null && mask.setPointerCapture(e.pointerId);  
  }  
  function onMove(e){  
    if(!dragging) return;  
    const pt = e.touches ? e.touches[0] : e;  
    dx = pt.clientX - startX;  
    const dy = pt.clientY - startY;  
    const rot = Math.max(-24, Math.min(24, dx/8));  
    mask.style.transform = `translate(${dx}px, ${dy*0.15}px) rotate(${rot}deg)`;  
  }  
  function onUp(){  
    if(!dragging) return;  
    dragging = false;  
    mask.classList.remove('dragging'); mask.classList.add('settling');  
    if(Math.abs(dx) > width()*0.32){  
      const dir = dx<0?-1:1;  
      mask.style.transform = `translateX(${dir*160}%) rotate(${dir*18}deg)`;  
      done = true;  
      setTimeout(()=>{ mask.classList.add('gone'); onRevealed(); }, 280);  
    } else {  
      mask.style.transform = 'translate(0,0) rotate(0)';  
    }  
  }  
  mask.addEventListener('pointerdown', onDown);  
  mask.addEventListener('pointermove', onMove);  
  mask.addEventListener('pointerup', onUp);  
  mask.addEventListener('pointercancel', onUp);  
  mask.addEventListener('click', ()=>{ if(!done && dx===0) autoRevealFromClick(); });  
  function autoRevealFromClick(){  
    mask.classList.add('settling');  
    mask.style.transform = 'translateX(160%) rotate(18deg)';  
    done = true;  
    setTimeout(()=>{ mask.classList.add('gone'); onRevealed(); }, 280);  
  }  
}  
  
/* ---------------- Inventory (페이지네이션) ---------------- */  
let invFilter = {sort:'recent', rarity:'all', fav:false};  
let invPage = { pageSize:20, cursors:[null], pageIndex:0, hasNext:false, loading:false, initialized:false };  
let invLastRoute = null;  
window.addEventListener('hashchange', ()=>{  
  const r = currentRoute();  
  if(r==='/inventory' && invLastRoute!=='/inventory') resetInvPage();  
  invLastRoute = r;  
});  
function resetInvPage(){  
  invPage = { pageSize:20, cursors:[null], pageIndex:0, hasNext:false, loading:false, initialized:true };  
  loadInventoryPage(0);  
}  
function buildInventoryQuery(cursorDoc){  
  const base = collection(db,'inventories',state.user.uid,'items');  
  const clauses = [];  
  if(invFilter.rarity!=='all') clauses.push(where('rarity','==',invFilter.rarity));  
  if(invFilter.fav) clauses.push(where('isFavorite','==',true));  
  const canOrder = (invFilter.rarity==='all' && !invFilter.fav); // rarity/fav 필터 시 복합색인 없이 동작하도록 orderBy 생략  
  const parts = [base, ...clauses];  
  if(canOrder) parts.push(orderBy('obtainedAt','desc'));  
  if(cursorDoc) parts.push(startAfter(cursorDoc));  
  parts.push(limit(invPage.pageSize+1));  
  return query(...parts);  
}  
async function loadInventoryPage(pageIndex){  
  if(!state.user) return;  
  invPage.loading = true; render();  
  try{  
    const cursorDoc = invPage.cursors[pageIndex] || null;  
    const snap = await getDocs(buildInventoryQuery(cursorDoc));  
    let docs = snap.docs;  
    const hasNext = docs.length > invPage.pageSize;  
    if(hasNext) docs = docs.slice(0, invPage.pageSize);  
    state.inventory = docs.map(d=>({id:d.id, ...d.data()})).filter(i=>i.status==='ACTIVE' || i.status==='CLAIM_REQUESTED');  
    invPage.hasNext = hasNext;  
    invPage.pageIndex = pageIndex;  
    if(docs.length) invPage.cursors[pageIndex+1] = docs[docs.length-1];  
  }catch(e){  
    console.error('inventory load error', e);  
    toast('보관함을 불러오는 중 오류가 발생했습니다.','err');  
  }  
  invPage.loading = false; render();  
}  
function refreshInvPage(){ loadInventoryPage(invPage.pageIndex); }  
window.invNextPage = ()=>{ if(invPage.hasNext && !invPage.loading) loadInventoryPage(invPage.pageIndex+1); };  
window.invPrevPage = ()=>{ if(invPage.pageIndex>0 && !invPage.loading) loadInventoryPage(invPage.pageIndex-1); };  
function renderInventory(){  
  const u = state.user;  
  if(!invPage.initialized){ invPage.initialized = true; loadInventoryPage(0); }  
  let list = state.inventory.slice();  
  if(invFilter.sort==='rarity') list.sort((a,b)=>rarityRank(b.rarity)-rarityRank(a.rarity));  
  else if(invFilter.sort==='value') list.sort((a,b)=>b.sellCoin-a.sellCoin);  
  else list.sort((a,b)=>tsMillis(b.obtainedAt)-tsMillis(a.obtainedAt));  
  
  document.getElementById('app').innerHTML = `  
    <div class="topbar"><div class="topbar-row"><button class="btn sm" onclick="go('#/home')">뒤로</button><div class="logo">보관함</div><div class="spacer"></div><div class="coin-pill">${fmtCoin(u.coin)}</div></div></div>  
    <div class="inv-toolbar">  
      <span class="chip ${invFilter.fav?'on':''}" onclick="toggleInvFav()">즐겨찾기</span>  
      <span class="chip ${invFilter.rarity==='all'?'on':''}" onclick="setInvRarity('all')">전체</span>  
      <span class="chip ${invFilter.rarity==='N'?'on':''}" onclick="setInvRarity('N')">N</span>  
      <span class="chip ${invFilter.rarity==='R'?'on':''}" onclick="setInvRarity('R')">R</span>  
      <span class="chip ${invFilter.rarity==='SR'?'on':''}" onclick="setInvRarity('SR')">SR</span>  
      <span class="chip ${invFilter.rarity==='SSR'?'on':''}" onclick="setInvRarity('SSR')">SSR</span>  
      <span class="chip ${invFilter.rarity==='UR'?'on':''}" onclick="setInvRarity('UR')">UR</span>  
    </div>  
    <div class="inv-toolbar">  
      <select id="invSortSel" style="background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;">  
        <option value="recent" ${invFilter.sort==='recent'?'selected':''}>최신순</option>  
        <option value="rarity" ${invFilter.sort==='rarity'?'selected':''}>등급순</option>  
        <option value="value" ${invFilter.sort==='value'?'selected':''}>판매가순</option>  
      </select>  
      <span class="muted" style="align-self:center;">이 페이지 ${list.length}개</span>  
      ${invFilter.rarity!=='all' ? `<button class="btn sm danger" onclick="deleteRarityCards()">${esc(invFilter.rarity)} 등급 전체 판매</button>` : ''}  
    </div>  
    ${invPage.loading ? '<div class="empty">불러오는 중...</div>' : (list.length ? list.map(i=>`  
      <div class="inv-item">  
        ${i.imageUrl ? `<img src="${esc(i.imageUrl)}">` : `<div class="ii-noimg"></div>`}  
        <div class="ii-body">  
          <div class="ii-name">${esc(i.name)} ${i.isLocked?'(잠금)':''} ${i.isNew?'<span class="badge UR">NEW</span>':''}</div>  
          <span class="badge ${i.rarity}">${rarityLabel(i.rarity)}</span>  
          <div class="muted" style="margin-top:4px;">${fmtCoin(i.sellCoin)} 판매가 · ${kst(i.obtainedAt)}</div>  
          ${i.status==='CLAIM_REQUESTED' ? `<div class="muted" style="color:#B5810F;margin-top:4px;">수령 신청됨 (관리자 승인 대기)</div>` : ''}  
          <div class="ii-actions">  
            ${i.status==='ACTIVE' ? `  
              <button class="btn sm ${i.isFavorite?'gold':''}" onclick="toggleFav('${i.id}')">${i.isFavorite?'즐겨찾기 해제':'즐겨찾기'}</button>  
              <button class="btn sm" onclick="toggleLock('${i.id}')">${i.isLocked?'잠금 해제':'잠금'}</button>  
              ${!i.isLocked?`<button class="btn sm danger" onclick="sellItem('${i.id}')">즉시판매</button>`:''}  
              ${!i.isLocked?`<button class="btn sm mint" onclick="requestClaim('${i.id}')">수령 신청</button>`:''}  
            ` : `<button class="btn sm" onclick="cancelClaim('${i.id}')">수령 신청 취소</button>`}  
          </div>  
        </div>  
      </div>`).join('') : '<div class="empty">보관함이 비어있습니다. 홈에서 가챠를 진행해보세요.</div>')}  
    <div class="inv-toolbar" style="justify-content:center;align-items:center;">  
      <button class="btn sm" onclick="invPrevPage()" ${invPage.pageIndex===0||invPage.loading?'disabled':''}>이전</button>  
      <span class="muted" style="align-self:center;">${invPage.pageIndex+1} 페이지</span>  
      <button class="btn sm" onclick="invNextPage()" ${!invPage.hasNext||invPage.loading?'disabled':''}>다음</button>  
    </div>  
    ${bottomNavHtml('inventory')}  
  `;  
  document.getElementById('invSortSel').onchange = (e)=>{ invFilter.sort=e.target.value; render(); };  
}  
window.toggleInvFav = ()=>{ invFilter.fav=!invFilter.fav; resetInvPage(); };  
window.setInvRarity = (r)=>{ invFilter.rarity=r; resetInvPage(); };  
window.toggleFav = (itemId)=>{ updateInvItem(itemId, {isFavorite: !getInvItem(itemId).isFavorite}); };  
window.toggleLock = (itemId)=>{ updateInvItem(itemId, {isLocked: !getInvItem(itemId).isLocked}); };  
function getInvItem(itemId){ return state.inventory.find(i=>i.id===itemId); }  
function updateInvItem(itemId, patch){  
  updateDoc(doc(db,'inventories',state.user.uid,'items',itemId), {...patch, isNew:false})  
    .then(()=>refreshInvPage())  
    .catch(e=>toast('처리 실패','err'));

window.sellItem = async (itemId)=>{  
  const item = getInvItem(itemId);  
  if(!item || item.isLocked) return;  
  try{  
    await runTransaction(db, async(tx)=>{  
      const userRef = doc(db,'users',state.user.uid);  
      const userSnap = await tx.get(userRef);  
      const newCoin = userSnap.data().coin + item.sellCoin;  
      tx.update(userRef, {coin:newCoin, updatedAt:serverTimestamp()});  
      tx.update(doc(db,'inventories',state.user.uid,'items',itemId), {status:'SOLD'});  
      const ledgerRef = doc(collection(db,'coinLedgers'));  
      tx.set(ledgerRef, {uid:state.user.uid, type:'SELL', beforeCoin:userSnap.data().coin, changeCoin:item.sellCoin, afterCoin:newCoin,  
        memo:`${item.name} 즉시판매`, createdAt:serverTimestamp(), createdAtKST:kstNow()});

window.requestClaim = async (itemId)=>{  
  const itemRef = doc(db,'inventories',state.user.uid,'items',itemId);  
  const claimRef = doc(collection(db,'claimRequests'));  
  try{  
    await runTransaction(db, async(tx)=>{  
      const snap = await tx.get(itemRef);  
      if(!snap.exists()) throw new Error('NOT_FOUND');  
      const data = snap.data();  
      if(data.status!=='ACTIVE') throw new Error('INVALID_STATUS');  
      tx.update(itemRef, {status:'CLAIM_REQUESTED', claimRequestedAt: serverTimestamp()});  
      tx.set(claimRef, {  
        uid: state.user.uid, itemId, name: data.name||'', rarity: data.rarity||'',  
        status:'PENDING', claimRequestedAt: serverTimestamp(), claimRequestedAtKST: kstNow()  
      });  
    });  
    toast('수령 신청이 접수되었습니다.','ok');  
    refreshInvPage();  
  }catch(e){  
    console.error('requestClaim error', e);  
    if(e.message==='NOT_FOUND') toast('아이템을 찾을 수 없습니다.','err');  
    else if(e.message==='INVALID_STATUS') toast('이미 처리 중인 아이템입니다.','err');  
    else if(e.code==='permission-denied') toast('권한이 없어 신청할 수 없습니다. 관리자에게 문의해주세요.','err');  
    else toast('처리 중 오류가 발생했습니다. ('+(e.code||e.message)+')','err');  
  }  
};  
window.cancelClaim = async (itemId)=>{  
  try{  
    await updateDoc(doc(db,'inventories',state.user.uid,'items',itemId), {status:'ACTIVE', claimRequestedAt:null});  
    const snap = await getDocs(query(collection(db,'claimRequests'), where('uid','==',state.user.uid), where('itemId','==',itemId), where('status','==','PENDING')));  
    await Promise.all(snap.docs.map(d=>deleteDoc(doc(db,'claimRequests',d.id))));  
    toast('수령 신청을 취소했습니다.','ok');  
    refreshInvPage();  
  }catch(e){ toast('처리 실패','err'); }  
};  
window.deleteRarityCards = async function(){  
  if(invFilter.rarity==='all') return toast('판매할 등급을 선택해주세요.','err');  
  const rarity = invFilter.rarity;  
  if(!confirm(`${rarityLabel(rarity)} 등급 카드를 모두 판매할까요? (잠금된 카드는 제외됩니다) 되돌릴 수 없습니다.`)) return;  
  try{  
    const snap = await getDocs(query(collection(db,'inventories',state.user.uid,'items'),  
      where('rarity','==',rarity), where('status','==','ACTIVE')));  
    const targets = snap.docs.filter(d=>!d.data().isLocked);  
    if(targets.length===0){ toast('판매할 카드가 없습니다.','err'); return; }  
    const totalCoin = targets.reduce((s,d)=>s+(d.data().sellCoin||0),0);  
    let batch = writeBatch(db);  
    let count = 0;  
    for(const d of targets){  
      batch.update(d.ref, {status:'SOLD'});  
      count++;  
      if(count % 400 === 0){ await batch.commit(); batch = writeBatch(db); }  
    }  
    await batch.commit();  
    await runTransaction(db, async(tx)=>{  
      const userRef = doc(db,'users',state.user.uid);  
      const userSnap = await tx.get(userRef);  
      const before = userSnap.data().coin || 0;  
      const after = before + totalCoin;  
      tx.update(userRef, {coin:after, updatedAt:serverTimestamp()});  
      const ledgerRef = doc(collection(db,'coinLedgers'));  
      tx.set(ledgerRef, {uid:state.user.uid, type:'SELL', beforeCoin:before, changeCoin:totalCoin, afterCoin:after,  
        memo:`${rarityLabel(rarity)} 등급 전체 판매 (${count}개)`, createdAt:serverTimestamp(), createdAtKST:kstNow()});  
    });  
    toast(`${count}개 카드를 판매하여 ${totalCoin} 코인을 받았습니다.`,'ok');  
    resetInvPage();  
  }catch(e){  
    console.error('deleteRarityCards error', e);  
    toast('판매 중 오류가 발생했습니다.','err');  
  }  
};

async function submitCoinOp(userUid, type){  
  const amtEl = type==='CHARGE' ? document.getElementById('ca_charge_amt') : document.getElementById('ca_deduct_amt');  
  const memoEl = type==='CHARGE' ? document.getElementById('ca_charge_memo') : document.getElementById('ca_deduct_memo');  
  const amt = parseInt(amtEl.value,10);  
  const memo = memoEl.value.trim();  
  if(!amt || amt<=0) return toast('금액을 입력해주세요.','err');  
  if(!memo) return toast('메모를 입력해주세요.','err');  
  const delta = type==='CHARGE' ? amt : -amt;  
  try{  
    const result = await runTransaction(db, async(tx)=>{  
      const userRef = doc(db,'users',userUid);  
      const snap = await tx.get(userRef);  
      if(!snap.exists()) throw new Error('USER_NOT_FOUND');  
      const before = snap.data().coin || 0;  
      const after = before + delta;  
      if(after<0) throw new Error('NEGATIVE');  
      tx.update(userRef, {coin:after, updatedAt:serverTimestamp(), updatedAtKST:kstNow()});  
      const ledgerRef = doc(collection(db,'coinLedgers'));  
      tx.set(ledgerRef, {uid:userUid, type, beforeCoin:before, changeCoin:delta, afterCoin:after, memo,  
        adminUid:state.user.uid, adminName:state.user.displayName, createdAt:serverTimestamp(), createdAtKST:kstNow()});  
      return {before, after};  
    });  
    await addAuditLog(type==='CHARGE'?'코인 충전':'코인 차감', userUid, {coin:result.before}, {coin:result.after, memo});  
    // 재조회 없이 로컬 캐시만 갱신(read 절감)  
    if(state.users[userUid]) state.users[userUid] = {...state.users[userUid], coin:result.after};  
    closeModal(); toast('코인이 처리되었습니다.','ok');  
    if(state._coinLedgersLoaded) loadAdminCoinLedgers(); else render();  
  }catch(e){  
    console.error('submitCoinOp error', e);  
    if(e.message==='NEGATIVE') toast('차감 후 코인이 음수가 될 수 없습니다.','err');  
    else if(e.message==='USER_NOT_FOUND') toast('대상 사용자를 찾을 수 없습니다.','err');  
    else if(e.code==='permission-denied') toast('권한이 없어 처리할 수 없습니다. Firestore 보안 규칙에서 관리자가 다른 사용자의 coin 필드와 coinLedgers 문서를 수정/생성할 수 있도록 허용되어 있는지 확인해주세요.','err');  
    else if(e.code==='resource-exhausted') toast('Firebase 사용량 한도를 초과했습니다. Firebase 콘솔의 Usage 탭을 확인하거나 Blaze 요금제로 전환해주세요.','err');  
    else toast('처리 중 오류가 발생했습니다. ('+(e.code||e.message)+')','err');  
  }  
}

window.duplicatePack = async function(packId){  
  const src = state.cardPacks.find(x=>x.id===packId);  
  const {id, ...rest} = src;  
  const ref = await addDoc(collection(db,'cardPacks'), {...rest, name: src.name+' (복제)', sortOrder: state.cardPacks.length+1, createdAt:serverTimestamp(), createdAtKST:kstNow(), updatedAt:serverTimestamp()});  
  const srcProducts = state.products.filter(p=>p.cardPackId===packId);  
  for(const sp of srcProducts){  
    const {id:spid, ...prest} = sp;  
    await addDoc(collection(db,'products'), {...prest, cardPackId:ref.id, createdAt:serverTimestamp(), createdAtKST:kstNow(), updatedAt:serverTimestamp()});  
  }  
  await addAuditLog('카드팩 복제', ref.id, {from:packId}, null);  
  await Promise.all([reloadCardPacks(), reloadProducts()]);  
  toast('카드팩이 복제되었습니다.','ok'); render();  
};  
window.deleteCardPack = async function(packId, name){  
  if(!confirm(name+' 카드팩을 정말 삭제할까요? 이 카드팩에 속한 상품도 함께 삭제되며, 되돌릴 수 없습니다.')) return;  
  try{  
    const relatedProducts = state.products.filter(p=>p.cardPackId===packId);  
    let batch = writeBatch(db);  
    let count = 0;  
    for(const p of relatedProducts){  
      batch.delete(doc(db,'products',p.id));  
      count++;  
      if(count % 400 === 0){ await batch.commit(); batch = writeBatch(db); }  
    }  
    await batch.commit();  
    await deleteDoc(doc(db,'cardPacks',packId));  
    await addAuditLog('카드팩 삭제', packId, {name, deletedProducts:relatedProducts.length}, null);  
    await Promise.all([reloadCardPacks(), reloadProducts()]);  
    toast('카드팩이 삭제되었습니다.','ok'); render();  
  }catch(e){  
    console.error('deleteCardPack error', e);  
    toast('삭제 중 오류가 발생했습니다.','err');  
  }  
};

window.approveChargeRequest = async function(reqId, userUid, amount){  
  if(!confirm(`${fmtCoin(amount)} 코인을 지급하고 요청을 승인할까요?`)) return;  
  try{  
    const result = await runTransaction(db, async(tx)=>{  
      const userRef = doc(db,'users',userUid);  
      const snap = await tx.get(userRef);  
      if(!snap.exists()) throw new Error('USER_NOT_FOUND');  
      const before = snap.data().coin || 0;  
      const after = before + amount;  
      tx.update(userRef, {coin:after, updatedAt:serverTimestamp(), updatedAtKST:kstNow()});  
      const ledgerRef = doc(collection(db,'coinLedgers'));  
      tx.set(ledgerRef, {uid:userUid, type:'CHARGE', beforeCoin:before, changeCoin:amount, afterCoin:after,  
        memo:'충전 요청 승인', adminUid:state.user.uid, adminName:state.user.displayName, createdAt:serverTimestamp(), createdAtKST:kstNow()});  
      tx.update(doc(db,'chargeRequests',reqId), {status:'APPROVED', approvedAt:serverTimestamp(), approvedBy:state.user.uid});  
      return {before, after};  
    });  
    await addAuditLog('충전 요청 승인', userUid, {coin:result.before}, {coin:result.after, amount});  
    // 재조회 없이 로컬 캐시만 갱신(read 절감)  
    if(state.users[userUid]) state.users[userUid] = {...state.users[userUid], coin:result.after};  
    state.chargeRequests = state.chargeRequests.filter(x=>x.id!==reqId);  
    toast('충전이 승인되었습니다.','ok');  
    if(state._coinLedgersLoaded) loadAdminCoinLedgers(); else render();  
  }catch(e){  
    console.error('approveChargeRequest error', e);  
    if(e.message==='USER_NOT_FOUND') toast('대상 사용자를 찾을 수 없습니다.','err');  
    else if(e.code==='permission-denied') toast('권한이 없어 처리할 수 없습니다. Firestore 보안 규칙에서 관리자가 다른 사용자의 coin/chargeRequests 문서를 수정할 수 있도록 허용되어 있는지 확인해주세요.','err');  
    else if(e.code==='resource-exhausted') toast('Firebase 사용량 한도를 초과했습니다. Firebase 콘솔의 Usage 탭을 확인하거나 Blaze 요금제로 전환해주세요.','err');  
    else toast('처리 중 오류가 발생했습니다. ('+(e.code||e.message)+')','err');  
  }  
};

    <div class="table-wrap"><table><thead><tr><th>시간</th><th>닉네임</th><th>카드팩</th><th>타입</th><th>사용코인</th><th>결과</th></tr></thead><tbody>  
      ${logs.map(l=>`<tr>  
        <td>${kst(l.createdAt)}</td><td>${esc(l.displayName)}</td><td>${esc(l.cardPackName)}</td><td>${esc(l.drawType)}</td><td>${l.usedCoin}</td>  
        <td>${(l.results||[]).map(r=>`<span class="badge ${r.rarity}">${esc(r.name)}</span>`).join(' ')}</td>  
      </tr>`).join('') || '<tr><td colspan="6" class="muted">기록 없음</td></tr>'}  
    </tbody></table></div>  
  `;  
}  
  
function adminNotices(c){  
  const notices = state.notices.slice().sort((a,b)=>tsMillis(b.createdAt)-tsMillis(a.createdAt));  
  c.innerHTML = `  
    <div class="admin-topbar"><h1>공지 관리</h1><button class="btn sm" onclick="reloadNotices().then(render)">새로고침</button><button class="btn primary sm" id="ntNewBtn">공지 작성</button></div>  
    <div class="table-wrap"><table><thead><tr><th>제목</th><th>유형</th><th>활성</th><th>작성일</th><th>작업</th></tr></thead><tbody>  
      ${notices.map(n=>`<tr>  
        <td>${esc(n.title)}</td><td>${esc(n.noticeType)}</td>  
        <td>${n.isActive?'<span class="badge R">ON</span>':'<span class="badge N">OFF</span>'}</td>  
        <td>${kst(n.createdAt)}</td>  
        <td><button class="btn sm" onclick="openNoticeForm('${n.id}')">수정</button>  
        <button class="btn sm ${n.isActive?'danger':''}" onclick="toggleNoticeActive('${n.id}')">${n.isActive?'비활성화':'활성화'}</button></td>  
      </tr>`).join('') || '<tr><td colspan="5" class="muted">공지 없음</td></tr>'}  
    </tbody></table></div>  
  `;  
  document.getElementById('ntNewBtn').onclick = ()=>openNoticeForm(null);  
}  
window.openNoticeForm = function(noticeId){  
  const n = noticeId ? state.notices.find(x=>x.id===noticeId) : {title:'',content:'',noticeType:'GENERAL',isActive:true};  
  openModal(`  
    <div class="modal-head"><div class="mt">${noticeId?'공지 수정':'공지 작성'}</div><button class="btn sm" onclick="closeModal()">닫기</button></div>  
    <div class="field"><label>제목</label><input id="nt_title" value="${esc(n.title)}"></div>  
    <div class="field"><label>내용</label><textarea id="nt_content" style="min-height:120px;">${esc(n.content)}</textarea></div>  
    <div class="field"><label>유형</label><select id="nt_type">  
      <option value="GENERAL" ${n.noticeType==='GENERAL'?'selected':''}>일반</option>  
      <option value="URGENT" ${n.noticeType==='URGENT'?'selected':''}>긴급</option>  
      <option value="POPUP" ${n.noticeType==='POPUP'?'selected':''}>팝업</option>  
    </select></div>  
    <button class="btn primary block" id="nt_save">저장</button>  
  `);  
  document.getElementById('nt_save').onclick = async ()=>{  
    const title = document.getElementById('nt_title').value.trim();  
    const content = document.getElementById('nt_content').value.trim();  
    if(!title || !content) return toast('제목과 내용을 입력해주세요.','err');  
    const data = {title, content, noticeType: document.getElementById('nt_type').value};  
    try{  
      if(noticeId){  
        await updateDoc(doc(db,'notices',noticeId), data);  
        await addAuditLog('공지 수정', noticeId, null, data);  
      } else {  
        const ref = await addDoc(collection(db,'notices'), {...data, isActive:true, createdAt:serverTimestamp(), createdAtKST:kstNow()});  
        await addAuditLog('공지 생성', ref.id, null, data);  
      }  
      await reloadNotices();  
      closeModal(); toast('저장되었습니다.','ok'); render();  
    }catch(e){ toast('저장 중 오류가 발생했습니다.','err'); }  
  };  
};  
window.toggleNoticeActive = async function(noticeId){  
  const n = state.notices.find(x=>x.id===noticeId);  
  await updateDoc(doc(db,'notices',noticeId), {isActive: !n.isActive});  
  await addAuditLog('공지 활성화토글', noticeId, null, {isActive: !n.isActive});  
  // 재조회 없이 로컬 캐시만 갱신(read 절감)  
  n.isActive = !n.isActive;  
  toast('변경되었습니다.','ok'); render();  
};  
  
function adminSettings(c){  
  const s = state.settings;  
  const draft = {logoUrl: s.logoUrl||'', defaultImageUrl: s.defaultImageUrl||''};  
  c.innerHTML = `  
    <div class="admin-topbar"><h1>사이트 설정</h1></div>  
    <div class="field"><label>사이트 이름</label><input id="st_name" value="${esc(s.siteName||'')}"></div>  
    ${uploadFieldHtml('st_logo','사이트 로고 이미지',draft,'logoUrl','settings')}  
    ${uploadFieldHtml('st_default','기본(빈 이미지) 대체 이미지',draft,'defaultImageUrl','settings')}  
    <div class="field"><label><input type="checkbox" id="st_maint" ${s.maintenanceMode?'checked':''} style="width:auto;margin-right:6px;">운영모드(점검모드) 활성화</label></div>  
    <button class="btn primary block" id="st_save">저장</button>  
  `;  
  wireUploadField('st_logo', draft, 'logoUrl', 'settings');  
  wireUploadField('st_default', draft, 'defaultImageUrl', 'settings');  
  document.getElementById('st_save').onclick = async ()=>{  
    const before = {...s};  
    const data = {  
      siteName: document.getElementById('st_name').value.trim() || '가챠샵',  
      logoUrl: draft.logoUrl, defaultImageUrl: draft.defaultImageUrl,  
      maintenanceMode: document.getElementById('st_maint').checked,  
    };  
    await setDoc(doc(db,'siteSettings','config'), data, {merge:true});  
    await addAuditLog('사이트 설정 변경', 'siteSettings', before, data);  
    await reloadSettings();  
    toast('설정이 저장되었습니다.','ok'); render();  
  };  
}  
  
/* ---------- Audit Logs: filter + CSV ---------- */  
let logFilter = {admin:'', action:'', from:'', to:''};  
function adminLogs(c){  
  if(!state._auditLogsLoaded){ state._auditLogsLoaded = true; loadAdminAuditLogs(); }  
  const admins = state.admins;  
  let logs = state.auditLogs.slice();  
  if(logFilter.admin) logs = logs.filter(l=>l.adminUid===logFilter.admin);  
  if(logFilter.action) logs = logs.filter(l=>l.action.includes(logFilter.action));  
  if(logFilter.from) logs = logs.filter(l=>tsMillis(l.createdAt) >= new Date(logFilter.from).getTime());  
  if(logFilter.to) logs = logs.filter(l=>tsMillis(l.createdAt) <= new Date(logFilter.to).getTime()+86400000);  
  c.innerHTML = `  
    <div class="admin-topbar"><h1>감사 로그</h1><button class="btn sm" onclick="loadAdminAuditLogs()">새로고침</button><button class="btn primary sm" id="logCsvBtn">CSV 다운로드</button></div>  
    <div class="filter-bar">  
      <select id="logAdminSel"><option value="">전체 관리자</option>${admins.map(a=>`<option value="${a.uid}" ${logFilter.admin===a.uid?'selected':''}>${esc(a.displayName)}</option>`).join('')}</select>  
      <input id="logActionInput" placeholder="액션 검색 (예: 코인)" value="${esc(logFilter.action)}">  
      <input id="logFromInput" type="date" value="${logFilter.from}">  
      <input id="logToInput" type="date" value="${logFilter.to}">  
    </div>  
    <div class="table-wrap"><table><thead><tr><th>시간</th><th>관리자</th><th>액션</th><th>대상</th></tr></thead><tbody>  
      ${logs.map(l=>`<tr><td>${kst(l.createdAt)}</td><td>${esc(l.adminName)}</td><td>${esc(l.action)}</td><td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;">${esc(l.target)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">조건에 맞는 기록이 없습니다.</td></tr>'}  
    </tbody></table></div>  
  `;  
  document.getElementById('logAdminSel').onchange = (e)=>{ logFilter.admin=e.target.value; adminLogs(document.getElementById('adminContent')); };  
  document.getElementById('logActionInput').oninput = (e)=>{ logFilter.action=e.target.value; adminLogs(document.getElementById('adminContent')); };  
  document.getElementById('logFromInput').onchange = (e)=>{ logFilter.from=e.target.value; adminLogs(document.getElementById('adminContent')); };  
  document.getElementById('logToInput').onchange = (e)=>{ logFilter.to=e.target.value; adminLogs(document.getElementById('adminContent')); };  
  document.getElementById('logCsvBtn').onclick = ()=>downloadLogsCsv(logs);  
}  
function downloadLogsCsv(logs){  
  const header = ['시간','관리자','액션','대상'];  
  const rows = logs.map(l=>[kst(l.createdAt), l.adminName, l.action, l.target].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','));  
  const csv = [header.join(','), ...rows].join('\n');  
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});  
  const url = URL.createObjectURL(blob);  
  const a = document.createElement('a');  
  a.href = url; a.download = `audit-logs-${Date.now()}.csv`;  
  document.body.appendChild(a); a.click(); a.remove();  
  URL.revokeObjectURL(url);  
}  
  
/* ---------- Admins list ---------- */  
function adminAdminsList(c){  
  if(!state._usersLoaded){ loadAdminUsers(); }  
  const admins = state.admins;  
  const nonAdmins = Object.values(state.users).filter(u=>u.role!=='ADMIN');  
  const selUid = window._adminSelUid || (admins[0] && admins[0].uid);  
  window._adminSelUid = selUid;  
  if(!state._auditLogsLoaded){ state._auditLogsLoaded = true; loadAdminAuditLogs(); }  
  const logs = state.auditLogs.filter(l=>l.adminUid===selUid).slice(0,100);  
  c.innerHTML = `  
    <div class="admin-topbar"><h1>관리자 목록</h1></div>  
    <div class="field-row" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:16px;">  
      <div class="field" style="flex:1;margin-bottom:0;">  
        <label>관리자로 지정할 사용자</label>  
        <select id="adminAddSel">  
          ${nonAdmins.length ? nonAdmins.map(u=>`<option value="${u.uid}">${esc(u.displayName)} (${esc(u.loginId)})</option>`).join('') : '<option value="">지정 가능한 사용자가 없습니다</option>'}  
        </select>  
      </div>  
      <button class="btn primary sm" id="adminAddBtn" ${nonAdmins.length?'':'disabled'}>관리자로 추가</button>  
    </div>  
    <div class="table-wrap" style="margin-bottom:16px;"><table><thead><tr><th>닉네임</th><th>아이디</th><th>역할</th><th>가입일</th><th>선택</th></tr></thead><tbody>  
      ${admins.map(a=>`<tr style="${a.uid===selUid?'background:rgba(255,143,163,.06);':''}">  
        <td>${esc(a.displayName)}</td><td>${esc(a.loginId)}</td><td><span class="badge UR">ADMIN</span></td><td>${kst(a.createdAt)}</td>  
        <td><button class="btn sm" onclick="selectAdminHistory('${a.uid}')">이력 보기</button></td>  
      </tr>`).join('') || '<tr><td colspan="5" class="muted">관리자가 없습니다.</td></tr>'}  
    </tbody></table></div>  
    <div class="h2">${admins.find(a=>a.uid===selUid) ? esc(admins.find(a=>a.uid===selUid).displayName) : ''}님의 변경 이력</div>  
    <div class="table-wrap"><table><thead><tr><th>시간</th><th>액션</th><th>대상</th></tr></thead><tbody>  
      ${logs.map(l=>`<tr><td>${kst(l.createdAt)}</td><td>${esc(l.action)}</td><td>${esc(l.target)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">이력이 없습니다.</td></tr>'}  
    </tbody></table></div>  
  `;  
  const addBtn = document.getElementById('adminAddBtn');  
  if(addBtn) addBtn.onclick = ()=>{  
    const uid = document.getElementById('adminAddSel').value;  
    if(!uid) return;  
    toggleAdminRole(uid, true);  
  };  
}  
window.selectAdminHistory = function(uidVal){ window._adminSelUid = uidVal; adminAdminsList(document.getElementById('adminContent')); };  
</script>
